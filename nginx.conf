server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/markdown text/plain;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # Los sprites no cambian entre despliegues
    location /sprites/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML/JS/CSS: revalidar siempre para que un despliegue nuevo se vea de inmediato
    location ~* \.(html|js|css|md)$ {
        add_header Cache-Control "no-cache";
    }
}
